<style>
:root{color-scheme:dark;--fond:#140b06;--parchemin:#ecdcb8;--encre:#2a1b10;--laiton:#e0a846;--vin:#5a1e19;--doux:#6b4a2a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#3a200f,#0d0704 70%);background-color:var(--fond);color:var(--encre);font-family:"Alegreya",Georgia,serif;font-size:17.5px;line-height:1.6;padding:32px 16px 48px}
.feuille{max-width:760px;margin:0 auto;padding:36px 40px 28px;border-radius:4px;background:radial-gradient(ellipse at 15% 5%,rgba(255,255,255,.45),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(120,70,20,.3),transparent 60%),var(--parchemin);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 0 60px rgba(120,70,20,.3)}
.retour{display:inline-block;margin-bottom:18px;font-family:"Alegreya SC",Georgia,serif;letter-spacing:.06em;font-size:15px;color:var(--vin);text-decoration:none}
.retour:hover{text-decoration:underline}
h1{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:44px;line-height:1.05;margin:0 0 6px;color:var(--vin);text-wrap:balance}
.maj{margin:0 0 24px;font-family:"Alegreya SC",Georgia,serif;font-size:14px;letter-spacing:.06em;color:var(--doux)}
h2{font-family:"Pirata One",Georgia,serif;font-weight:400;font-size:27px;margin:28px 0 6px;color:var(--vin)}
p,li{max-width:68ch}
ul{padding-left:22px}
li{margin-bottom:6px}
a{color:var(--vin)}
.encadre{padding:12px 16px;border-radius:6px;background:rgba(120,70,20,.12);border-left:4px solid var(--laiton)}
footer{margin-top:30px;padding-top:14px;border-top:1px dashed rgba(90,30,25,.35);font-size:14.5px;color:var(--doux)}
@media (max-width:520px){.feuille{padding:24px 18px 20px}h1{font-size:34px}}
</style>
